# Redis Sentinel Configuration - Instance 1
# Monitors Redis Master/Replica cluster for automatic failover
# ============================================================================

# Port on which Sentinel listens
port 26379

# Network bind (allow connections from anywhere in cluster)
bind 0.0.0.0

# Working directory
dir /tmp

# ============================================================================
# MONITORING CONFIGURATION
# ============================================================================

# Master name and its location
# Format: sentinel monitor <master-name> <master-ip> <master-port> <quorum>
# Quorum: Number of Sentinels that must agree to promote a replica
# Using 2/3 means: 2 out of 3 Sentinels must agree to failover
monitor mymaster redis-master 6379 2

# Timeout for detecting unreachable master (in milliseconds)
# If master is unreachable for this duration, failover starts
down-after-milliseconds mymaster 5000

# Failover timeout: Maximum time in milliseconds to complete failover
# After this time, failover is retried if interrupted
failover-timeout mymaster 10000

# Parallel syncs: Number of replicas that can be synchronized at once during failover
# Setting to 1 ensures only one replica syncs at a time (safer)
parallel-syncs mymaster 1

# ============================================================================
# NOTIFICATION SCRIPTS
# ============================================================================

# Script called when master/replica changes role or state
# Called with: <event-type> <master-name> <old-master-ip> <old-master-port> <new-master-ip> <new-master-port>
# notification-script /path/to/notify.sh

# Script called to reconfigure clients after failover
# Called with: <master-name> <from-ip> <from-port> <to-ip> <to-port>
# client-reconfig-script /path/to/reconfig.sh

# ============================================================================
# PERSISTENCE & LOGGING
# ============================================================================

# Log level: debug | verbose | notice | warning
loglevel notice

# Log file (empty string means stdout)
logfile ""

# Syslog configuration (optional)
# syslog-enabled yes
# syslog-ident sentinel

# Background mode
daemonize no

# PID file
pidfile /var/run/sentinel-1.pid

# ============================================================================
# SAVE CONFIGURATION
# ============================================================================

# Sentinel saves its configuration whenever state changes
# This is necessary for recovery after restart
save 900 1      # If 1 key changed in 900s, save
save 300 10     # If 10 keys changed in 300s, save
save 60 10000   # If 10000 keys changed in 60s, save

# Database configuration file (auto-generated by Sentinel)
dbfilename dump.rdb

# ============================================================================
# ADVANCED SETTINGS
# ============================================================================

# Deny-of-service protection: Require password for HELLO command
# Uncomment to enable:
# sentinel deny-scripts-reconfig yes

# Enable ACL (Access Control Lists)
# aclfile /etc/sentinel/users.acl

# Cluster support (for Redis Cluster)
# cluster-enabled no

# ============================================================================
# QUORUM CONSIDERATIONS
# ============================================================================
#
# With 3 Sentinels (sentinel-1, sentinel-2, sentinel-3):
# - Need 2+ Sentinels to agree (quorum: 2) before promoting replica
# - Can tolerate 1 Sentinel going down
# - Cannot tolerate 2+ Sentinels going down (split-brain prevention)
#
# Deployment: Spread across 3 different machines/availability zones
#
# ============================================================================
