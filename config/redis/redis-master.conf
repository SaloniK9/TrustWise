# Redis Master Configuration for TrustWise
# Primary instance that services read/write requests
# Replicates data to standby replicas for failover capability

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Port the server listens on
port 6379

# Bind to all interfaces for cluster communication
bind 0.0.0.0

# Accept connections only from authenticated clients if requirepass is set
# requirepass foobared

# Database file
dbfilename dump.rdb

# Working directory for dump and AOF files
dir /data

# Daemonize (used in container: no)
daemonize no

# PID file
pidfile /var/run/redis_6379.pid

# ============================================================================
# MEMORY & EVICTION POLICY
# ============================================================================

# Maximum memory Redis can use
# If limit reached, eviction policy applies
maxmemory 512mb

# Eviction policy when max memory reached
# allkeys-lru: Remove any key using LRU (recommended for cache)
# volatile-lru: Remove keys with TTL using LRU
# allkeys-random: Remove random keys
# volatile-random: Remove random keys with TTL
# volatile-ttl: Remove keys with TTL, expire soonest first
# noeviction: Don't evict, return error on write
maxmemory-policy allkeys-lru

# ============================================================================
# REPLICATION SETUP
# ============================================================================

# The master doesn't use 'slaveof' or 'replicaof' (that's only for replicas)
# But configure replication settings

# Max number of client connections
maxclients 10000

# Number of replicas that can sync simultaneously
repl-diskless-sync no
repl-diskless-sync-delay 5

# Backlog for partial resynchronization
repl-backlog-size 1mb
repl-backlog-ttl 3600

# Disable TCP_NODELAY on replica socket
repl-disable-tcp-nodelay no

# ============================================================================
# REPLICATION SLOTS (For Sentinel/High Availability)
# ============================================================================

# Enable replication slots for reliable replication
# Slots preserve replication state across disconnections
max-replication-slots 3

# ============================================================================
# AOF (Append-Only File) PERSISTENCE
# ============================================================================

# AOF: Persists every write for durability
# Enables point-in-time recovery
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy:
# always: Fsync after every write (slowest, safest)
# everysec: Fsync every second (balanced, recommended)
# no: Let OS fsync (fastest, least safe)
appendfsync everysec

# Prevent fsync during AOF rewrite
no-appendfsync-on-rewrite no

# Trigger AOF rewrite when file exceeds:
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================================================
# RDB SNAPSHOT PERSISTENCE
# ============================================================================

# RDB snapshot at intervals
# Format: save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Disk read errors during save
stop-writes-on-bgsave-error yes

# Compress RDB snapshot (slower writes, smaller file)
rdbcompression yes

# Checksum in RDB file (slower write, safer recovery)
rdbchecksum yes

# ============================================================================
# LOGGING
# ============================================================================

# Log level: debug | verbose | notice | warning
loglevel notice

# Log to stdout (container friendly)
logfile ""

# Syslog (optional)
# syslog-enabled no
# syslog-ident redis

# ============================================================================
# SLOW LOG
# ============================================================================

# Commands taking longer than this (microseconds) are logged
slowlog-log-slower-than 10000

# Number of slow log entries to keep
slowlog-max-len 128

# ============================================================================
# STATS & MONITORING
# ============================================================================

# Latency monitoring (optional, for diagnostics)
# latency-monitor-threshold 0

# Client output buffer limits (prevent memory exhaustion from slow clients)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Protocol: RESP2 or RESP3
# proto-max-bulk-len 512mb

# ============================================================================
# KEYS & EXPIRATION
# ============================================================================

# Enable active key eviction (default: on)
# Redis will evict keys based on maxmemory-policy
# lazyfree-lazy-eviction no
# lazyfree-lazy-expire no

# ============================================================================
# IMPORTANT FOR SENTINEL
# ============================================================================

# These settings are critical for Sentinel to monitor the master:
# 1. Port matches sentinel's monitor configuration (6379)
# 2. ACL disabled (or appropriate sentinel user configured)
# 3. Replication working (replicas connecting successfully)
# 4. AOF enabled (for durability during failover)

min-slaves-to-write 0
min-slaves-max-lag 10

# ============================================================================
