# Redis Master Configuration - Simple Working Config
bind 0.0.0.0
port 6379
protected-mode no
daemonize no
dir /data
dbfilename dump.rdb
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxclients 10000
maxmemory 512mb
maxmemory-policy allkeys-lru
slowlog-log-slower-than 10000
slowlog-max-len 128
min-replicas-to-write 1
min-replicas-max-lag 10
