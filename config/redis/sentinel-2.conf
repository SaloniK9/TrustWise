# Redis Sentinel Configuration - Instance 2
# Mirror of sentinel-1.conf with different port

port 26380

bind 0.0.0.0

dir /tmp

# Monitor same master as sentinel-1
monitor mymaster 127.0.0.1 6379 2

down-after-milliseconds mymaster 5000

failover-timeout mymaster 10000

parallel-syncs mymaster 1

loglevel notice

logfile ""

daemonize no

pidfile /var/run/sentinel-2.pid

save 900 1
save 300 10
save 60 10000

dbfilename dump.rdb
