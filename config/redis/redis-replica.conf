# Redis Replica Configuration for TrustWise
# Hot standby replicas that sync from master
# Promoted to master on failover via Sentinel

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Port inside container (keep default for consistency)
port 6379

# Bind to all interfaces
bind 0.0.0.0

# Database file
dbfilename dump.rdb

# Working directory
dir /var/lib/redis

# Daemonize (no for container)
daemonize no

# PID file
pidfile /var/run/redis_6379.pid

# ============================================================================
# REPLICATION (CRITICAL FOR REPLICA)
# ============================================================================

# Connect to master
# This tells Redis to act as a replica of the master
# Format: replicaof <master-ip> <master-port>
# For Docker Compose, use container name: redis-master:6379
replicaof redis-master 6379

# Master authentication (if master requires password)
# masterauth <master-password>

# Replica read-only mode (recommended for safety)
# Ensure replica doesn't accept writes that aren't from master
replica-read-only yes

# Replica lazy free: Free memory asynchronously (faster disconnect)
replica-lazy-free no

# Replica priority for Sentinel failover
# Lower priority = preferred for promotion
# 100 = high priority (promote first)
# 0 = never promote (backup only)
replica-priority 100

# Socket keepalive for master connection
repl-socket-keep-alive 1

# Wait for writes before responding to client (optional)
# repl-wait-for-backlog yes

# ============================================================================
# MEMORY & EVICTION
# ============================================================================

maxmemory 512mb
maxmemory-policy allkeys-lru

# ============================================================================
# PERSISTENCE
# ============================================================================

# AOF: Disable on replicas if using master's AOF
# Enables independent recovery of replica
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB snapshots (useful for replica recovery)
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes

# ============================================================================
# LOGGING
# ============================================================================

loglevel notice
logfile ""

# ============================================================================
# CLIENT LIMITS
# ============================================================================

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# REPLICA BEHAVIOR
# ============================================================================

# When replica loses connection to master, continue serving data
# Important for HA: Replica can serve stale data during disconnection
replica-serve-stale-data yes

# Disable TCP_NODELAY (batched responses, better bandwidth)
repl-disable-tcp-nodelay no

# Backlog for partial resynchronization
repl-backlog-size 1mb
repl-backlog-ttl 3600

# ============================================================================
# IMPORTANT FOR SENTINEL FAILOVER
# ============================================================================

# These settings ensure smooth failover:
# 1. replica-priority: 100 means this replica will be promoted on failover
# 2. replica-read-only: yes prevents accidental writes (safety)
# 3. appendonly: yes ensures data persists after promotion
# 4. replicaof: Correct master connection
#
# When Sentinel detects master down:
# 1. Selects replica with lowest priority (100 is promoted first)
# 2. Executes SLAVEOF NO ONE on selected replica
# 3. Replica becomes new master
# 4. Other replicas reconnect to new master
# 5. Application connection string updated
#
# Celery will automatically reconnect via Sentinel broker URL

# ============================================================================
