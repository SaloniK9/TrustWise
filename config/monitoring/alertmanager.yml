global:
  resolve_timeout: 5m
  slack_api_url: ''  # Leave empty; set via environment variable if using Slack

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    # Add webhook_configs, email_configs, slack_configs as needed
    webhook_configs:
      - url: 'http://localhost:5001/alerts'  # Local webhook for testing

  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'

  - name: 'warning'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/warning'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
