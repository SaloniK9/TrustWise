# PostgreSQL Primary (Master) Configuration for High Availability
# Configuration file: postgresql.conf
# Enable streaming replication to hot standby replicas
# Supports point-in-time recovery via WAL archiving

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

shared_buffers = 256MB              # 25% of system RAM for dedicated server
effective_cache_size = 1GB          # 50-75% of system RAM
maintenance_work_mem = 64MB         # For CREATE INDEX, VACUUM
work_mem = 4MB                      # Per operation memory

# ============================================================================
# WAL (Write-Ahead Logging) - CRITICAL FOR REPLICATION
# ============================================================================

# Replication level
# replica: Enable replication
# logical: Enable logical replication (for CDC if needed)
wal_level = replica

# Number of replicas that can connect
max_wal_senders = 3

# Maximum number of replication slots
max_replication_slots = 3

# Keep WAL segments for replicas to catch up
# Amount of WAL to keep: 1GB
wal_keep_size = 1GB

# WAL segment size (16MB is default)
# wal_segment_size = 16MB

# Enable logical decoding (optional)
max_logical_replication_workers = 4

# ============================================================================
# CHECKPOINTS
# ============================================================================

# When to trigger WAL checkpoints
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Segmented count
max_wal_size = 4GB
min_wal_size = 1GB

# ============================================================================
# ARCHIVING - WAL BACKUP TO S3 OR NFS
# ============================================================================

# Enable archiving for point-in-time recovery
archive_mode = on

# Archive command: Copy WAL files to backup location
# Variables:
#   %p = full path of file to archive
#   %f = file name only
#
# Option 1: Local NFS mount
# archive_command = 'test ! -f /mnt/wal_archive/%f && cp %p /mnt/wal_archive/%f'
#
# Option 2: S3 using aws-cli
# archive_command = 'aws s3 cp %p s3://trustwise-backups/wal/%f --sse AES256'
#
# Option 3: Azure Blob Storage
# archive_command = 'az storage blob upload -c wal-backup -n %f --file %p'

# For testing (local filesystem):
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300                   # Force archive every 5 minutes

# ============================================================================
# STREAMING REPLICATION - REPLICA SYNC
# ============================================================================

# Allow standby replicas to connect
# Configured in pg_hba.conf via replication role

# Synchronous replication (waits for replica ack before commit)
# synchronous_commit = remote_apply         # Safest: replica has applied
# synchronous_commit = remote_write         # Balanced: replica has written
# synchronous_commit = on                   # Default: slave has flushed

# For HA: Use 'on' or 'remote_write' for balance
synchronous_commit = remote_write

# Standby names for synchronization
# Leave empty for async, or specify standby names for sync
# synchronous_standby_names = 'standby1,standby2'
# For now, async (doesn't hang if replica slow)
synchronous_standby_names = ''

# Replication slot retention
# slot_retention_type = 'keep_min_byteslsn'
# min_slot_wal_keep_size = 1GB

# ============================================================================
# LOGGING - CRITICAL FOR DEBUGGING REPLICATION
# ============================================================================

# Log level
log_level = info

# Log destinations
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

# Log important events
log_connections = on
log_disconnections = on
log_duration = off                  # Log slow queries with log_min_duration_statement
log_lock_waits = on                 # Log lock waits
log_statement = 'none'              # Log all/dml/ddl or none
log_replication_commands = on        # Log REPLICATION commands
log_error_verbosity = default

# Slow query log
log_min_duration_statement = 1000   # Log queries taking > 1 second (ms)

# ============================================================================
# RECOVERY SETTINGS
# ============================================================================

# Recovery target for point-in-time recovery
# Configured in recovery.conf on standby/backup

# Restart after recovery
# recovery_target_recovery_conflict_policy = 'promote'

# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================

# Random page cost (SSD = lower, HDD = higher)
# SSD: 1.1 (sequential = random)
# HDD: 4 (default)
random_page_cost = 1.1              # Assume SSD

# Effective IO concurrency
effective_io_concurrency = 200

# Parallel query execution (PostgreSQL 10+)
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_workers_per_gather = 2

# ============================================================================
# STATISTICS & MONITORING
# ============================================================================

# Extended statistics
shared_preload_libraries = 'pg_stat_statements'

# Statement statistics tracking
track_activities = on
track_counts = on
track_functions = 'all'

# Replication monitoring
track_commit_timestamp = on

# ============================================================================
# MISCELLANEOUS
# ============================================================================

# Timezone
timezone = 'UTC'

# Locale
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Datestyle
datestyle = 'iso, mdy'

# ============================================================================
# CRITICAL FOR REPLICATION SUCCESS
# ============================================================================

# Verification checklist:
# 1. ✓ wal_level = replica            (enables replication)
# 2. ✓ max_wal_senders >= 3           (allows 3 replicas)
# 3. ✓ wal_keep_size = 1GB            (keeps WAL for catchup)
# 4. ✓ archive_mode = on              (enables backup)
# 5. ✓ archive_command configured     (saves WAL files)
# 6. ✓ synchronous_commit configured  (ensures consistency)
#
# Next: Configure pg_hba.conf for replica connections

# ============================================================================
