# pg_hba.conf: PostgreSQL Client Authentication Configuration
# ============================================================================
#
# Format:
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# Type:
#   local     - Unix socket connections
#   host      - TCP/IP connections
#   hostssl   - Encrypted TCP/IP
#   hostnossl - Unencrypted TCP/IP
#
# Authentication Methods:
#   trust     - Connections always trust
#   reject    - Connections always reject
#   md5       - MD5-hashed password (deprecated, use scram-sha-256)
#   password  - Clear text password (only on SSL)
#   scram-sha-256 - SCRAM SHA-256 (recommended)

# ============================================================================
# LOCAL CONNECTIONS (Same machine, Unix socket)
# ============================================================================

# PostgreSQL operator and administrator
local   all             postgres                                trust

# All local users can connect (for development)
local   all             all                                     trust

# ============================================================================
# TCP/IP CONNECTIONS (Network)
# ============================================================================

# Docker: Allow connections from application in same network
host    all             all             172.16.0.0/12          scram-sha-256

# Docker: Allow connections from any container (172.17.x.x)
host    all             all             172.17.0.0/16          scram-sha-256

# ============================================================================
# REPLICATION CONNECTIONS
# ============================================================================

# Allow 'replication' role to connect for streaming replication
# This is required for hot standby functionality
# Can be from:
#   - Standby replicas (via primary_conninfo)
#   - Backup tools (pg_basebackup)

# From any IP in same Docker network
host    replication     all             172.16.0.0/12          scram-sha-256
host    replication     all             172.17.0.0/16          scram-sha-256

# ============================================================================
# IPADDR-SPECIFIC RULES
# ============================================================================

# If using specific standby IPs, add explicit rules
# Example:
# host    replication     replication    192.168.1.100/32       scram-sha-256

# Application database user (trustwise_app)
host    trustwise_db    trustwise_app   172.16.0.0/12          scram-sha-256
host    trustwise_db    trustwise_app   172.17.0.0/16          scram-sha-256

# Development: Allow from localhost
host    all             all             127.0.0.1/32           trust
host    all             all             ::1/128                trust

# ============================================================================
# DEFAULT RULES
# ============================================================================

# Reject everything else (default deny)
# This is implicit if not matched

# ============================================================================
# IMPORTANT NOTES
# ============================================================================

#
# 1. REPLICATION ROLE ACCESS:
#    - Host-based authentication is checked in order
#    - First matching rule is used
#    - Replica role can only use 'replication' database
#
# 2. SECURITY BEST PRACTICES:
#    - Use scram-sha-256 for production
#    - Restrict IP ranges to known networks
#    - Use SSL for remote connections
#    - Regular password rotation for replication user
#
# 3. DOCKER NETWORKS:
#    - 172.16.0.0/12 - User-defined networks
#    - 172.17.0.0/16 - Default bridge network
#    - 192.168.x.x - Local networks
#
# 4. PASSWORD SETUP:
#    Create replication user:
#    CREATE ROLE replication WITH REPLICATION ENCRYPTED PASSWORD 'password' LOGIN;
#
#    Create application user:
#    CREATE ROLE trustwise_app WITH LOGIN PASSWORD 'app_password';
#    CREATE DATABASE trustwise_db OWNER trustwise_app;
#    GRANT ALL PRIVILEGES ON DATABASE trustwise_db TO trustwise_app;
#
# 5. VERIFICATION:
#    psql -U replication -h localhost -c "SELECT version();"
#    # Should connect successfully if authentication works
#

# ============================================================================
