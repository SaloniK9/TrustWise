# PostgreSQL Standby (Replica) Configuration
# Hot standby that syncs from primary via streaming replication
# Can be promoted to primary on failover

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# ============================================================================
# MEMORY SETTINGS (Same as primary for consistency)
# ============================================================================

shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 4MB

# ============================================================================
# STANDBY-SPECIFIC SETTINGS
# ============================================================================

# Enable hot standby mode (allow read-only queries)
hot_standby = on

# Maximum delay feedback to primary (seconds)
# Primary waits for replica ack up to this time
hot_standby_feedback = on

# Standby waits after disconnect (seconds)
wal_receiver_status_interval = 10

# Authentication retries
wal_receiver_timeout = 60s

# Replication connection timeout
wal_retrieve_retry_interval = 5s

# ============================================================================
# RECOVERY CONFIGURATION
# ============================================================================

# Primary connection info for streaming replication
# Format: host=HOST port=PORT user=USER password=PASSWORD
# This will be set in recovery.conf or postgresql.auto.conf

# Never promote to primary automatically (requires manual intervention)
# Unless configured otherwise for automatic failover

# Promote file location (create this to promote to primary)
# touch /var/lib/postgresql/promote

# ============================================================================
# WAL RETRIEVAL
# ============================================================================

# WAL files location
wal_level = replica

# Archive recovery files
# restore_command = 'cp /mnt/wal_archive/%f "%p"'

# ============================================================================
# LOGGING (Same as primary)
# ============================================================================

log_level = info
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 100MB

log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'none'
log_replication_commands = on
log_min_duration_statement = 1000

# ============================================================================
# PERFORMANCE
# ============================================================================

random_page_cost = 1.1              # SSD
effective_io_concurrency = 200

max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# ============================================================================
# STANDBY RECOVERY CONFLICT BEHAVIOR
# ============================================================================

# What to do if primary sends conflicting queries
# promote: Promote standby to primary (breaks replication)
# defer: Delay application until query finishes
# force: Kill the query and continue
max_standby_archive_delay = 5min
max_standby_streaming_delay = 5min
recovery_target_recovery_conflict_policy = 'promote'

# ============================================================================
# MONITORING
# ============================================================================

track_activities = on
track_counts = on
track_functions = 'all'
track_commit_timestamp = on

shared_preload_libraries = 'pg_stat_statements'

# ============================================================================
# MISCELLANEOUS
# ============================================================================

timezone = 'UTC'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
datestyle = 'iso, mdy'

# ============================================================================
# REPLICATION FLOW
# ============================================================================

# When PostgreSQL starts in standby mode:
# 1. Reads recovery.conf (or postgresql.auto.conf)
# 2. Connects to primary via primary_conninfo
# 3. Requests WAL stream via streaming replication
# 4. Applies WAL continuously
# 5. Allows read-only queries (hot standby mode)
#
# On failover (manual):
# 1. Run: pg_ctl promote (from postgresql user)
# 2. Or: touch /var/lib/postgresql/promote
# 3. PostgreSQL stops recovery, becomes primary
# 4. Allows read/write queries
# 5. Original primary must reconnect as replica

# ============================================================================
