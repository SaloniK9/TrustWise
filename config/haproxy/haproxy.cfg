# HAProxy Configuration for TrustWise API Load Balancing
# Load balancer distributes traffic across FastAPI instances
# Provides health checking and SSL termination

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

global
    # Maximum connections
    maxconn 4096
    
    # Logging configuration
    log 127.0.0.1 local0
    log 127.0.0.1 local1 notice
    
    # Daemon mode (for container: off)
    daemon off
    
    # User/group to run as
    # chroot /var/lib/haproxy
    # user haproxy
    # group haproxy
    
    # Default SSL settings
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2
    
    # CPU binding (optional, for performance)
    # cpu-map auto:1 0
    
    # Tune settings
    tune.maxconn 2000
    tune.ssl.default-dh-param 2048

# ============================================================================
# DEFAULTS SECTION
# ============================================================================

defaults
    # Mode: http | tcp | health
    mode http
    
    # Logging mode
    log global
    option httplog
    
    # Connection settings
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    
    # Enable keep-alive
    option http-keep-alive
    
    # Client IP forwarding (for app to see real IP)
    option forwardfor except 127.0.0.0/8
    
    # Denylogin
    option denylogin
    
    # Error files
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

# ============================================================================
# FRONTEND: Public-facing listener
# ============================================================================

frontend main
    # Listen on HTTP and HTTPS
    bind *:80
    bind *:443 ssl crt /etc/ssl/private/server.pem
    
    # Redirect HTTP to HTTPS
    http-request redirect scheme https code 301 if !{ ssl_fc }
    
    # Log requests
    log 127.0.0.1 local0 info
    
    # Capture request headers for debugging
    capture request header User-Agent len 128
    capture request header Host len 64
    
    # Rate limiting (connections per IP)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny if { sc_http_req_rate(0) gt 100 }
    
    # Set X-Forwarded-For header
    http-request add-header X-Forwarded-For %[src]
    http-request add-header X-Forwarded-Proto https
    
    # Route to FastAPI backend
    default_backend fastapi_servers

# ============================================================================
# BACKEND: FastAPI Instances
# ============================================================================

backend fastapi_servers
    # Load balancing algorithm
    # roundrobin: Simple round-robin
    # leastconn: Send to server with least connections
    # source: Hash on client IP (sticky)
    balance roundrobin
    
    # Health check configuration
    # Checks /health endpoint every 5 seconds
    # Server marked down after 2 consecutive failures
    # Back up after 2 consecutive successes
    option httpchk GET /health
    http-check expect status 200
    
    # Connection settings
    timeout check 2000
    
    # Sticky sessions (optional, commented out)
    # Use if you need session persistence
    # cookie SERVERID insert indirect nocache
    # http-response add-header Set-Cookie "SERVERID=...;Path=/"
    
    # Servers (FastAPI instances)
    # Format: server <name> <ip:port> check inter <ms> fall <count> rise <count>
    # inter: Check interval (milliseconds)
    # fall: Server marked down after this many failures
    # rise: Server marked up after this many successes
    
    server fastapi1 fastapi:8000 check inter 5000 fall 2 rise 2
    server fastapi2 fastapi:8001 check inter 5000 fall 2 rise 2
    server fastapi3 fastapi:8002 check inter 5000 fall 2 rise 2
    
    # Optional: Backup server (used if all others down)
    # server fastapi_backup 127.0.0.1:8003 backup
    
    # Connection options
    option forwardfor
    
    # Keep-alive
    http-reuse safe
    
    # Redirect prefix (optional)
    # redirect prefix /old /new code 301

# ============================================================================
# STATS PAGE: HAProxy Statistics Dashboard
# ============================================================================

listen stats
    # Listen on admin port
    bind *:8404
    
    # HTTP mode
    mode http
    
    # Enable stats
    stats enable
    
    # Stats URI
    stats uri /stats
    
    # Refresh interval (seconds)
    stats refresh 30s
    
    # Show legend
    stats show-legends
    
    # Show nodes
    stats show-node
    
    # Admin interface (enable modifying backend state)
    stats admin if TRUE
    
    # Optional: Require auth
    stats auth admin:trustwise
    
    # HTML/CSV/JSON output
    # stats show-desc "TrustWise HAProxy Statistics"

# ============================================================================
# ADVANCED: TCP Load Balancing (For Redis if needed)
# ============================================================================

# Uncomment if load balancing Redis connections
# listen redis_cluster
#     mode tcp
#     bind *:6379
#     balance roundrobin
#     server redis1 127.0.0.1:6379 check
#     server redis2 127.0.0.1:6380 check backup
#     server redis3 127.0.0.1:6381 check backup

# ============================================================================
# NOTES ON HEALTH CHECKS
# ============================================================================

# Health check logic:
# 1. HAProxy sends GET /health to each backend server
# 2. Expects HTTP 200 response
# 3. If fails for 2 consecutive checks: Server marked DOWN
# 4. If succeeds for 2 consecutive checks: Server marked UP
# 5. DOWN servers don't receive new connections
# 6. Existing connections continue until closed
#
# Graceful Degradation:
# - If 2/3 servers down: 1 server handles all traffic
# - If all servers down: HAProxy returns 503 error
#
# Connection Pooling:
# - http-reuse: safe reuses connections
# - Reduces latency by avoiding TCP handshake
# - Safe: Only for idempotent requests

# ============================================================================
# RATE LIMITING STRATEGY
# ============================================================================

# Current: 100 requests per 10 seconds per IP
# Adjust based on:
# - Application capacity
# - Expected usage patterns
# - DDoS prevention needs
#
# To increase:
# - Change "100" to higher number in http-request deny line
# - Verify FastAPI rate limiting doesn't interfere
#
# To implement per-endpoint limiting:
# - Use fastapi-limiter package
# - Or configure separate frontend for specific paths

# ============================================================================
# SSL/TLS CONFIGURATION
# ============================================================================

# Certificate file (/etc/ssl/private/server.pem should contain):
# - Private key
# - Server certificate
# - CA certificate chain (if using self-signed, not needed)
#
# Generate self-signed cert for testing:
# openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes
# cat cert.pem key.pem > server.pem
#
# For production:
# - Use signed certificate from CA
# - Implement certificate rotation
# - Use Let's Encrypt for free certificates

