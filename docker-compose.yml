networks:
  trustwise-network:
    driver: bridge
version: "3.8"

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trustwise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trustwise.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-primary
    networks:
      trustwise-network:
        aliases:
          - redis
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: trustwise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/monitoring/prometheus_rules.yml:/etc/prometheus/rules/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - trustwise-network

  # Phase 5A: Distributed Job Execution (Celery + Redis)
  # Phase 5B: High Availability with Redis Sentinel

  redis-master:
    image: redis:7-alpine
    container_name: trustwise-redis-master
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis/redis-master.conf:/usr/local/etc/redis/redis.conf
      - redis_master_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  redis-replica-1:
    image: redis:7-alpine
    container_name: trustwise-redis-replica-1
    ports:
      - "6380:6379"
    volumes:
      - ./config/redis/redis-replica.conf:/usr/local/etc/redis/redis.conf
      - redis_replica1_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: trustwise-redis-replica-2
    ports:
      - "6381:6379"
    volumes:
      - ./config/redis/redis-replica.conf:/usr/local/etc/redis/redis.conf
      - redis_replica2_data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  sentinel-1:
    image: redis:7-alpine
    container_name: trustwise-sentinel-1
    ports:
      - "26379:26379"
    volumes:
      - ./config/redis/sentinel-1.conf:/etc/redis/sentinel.conf
      - sentinel1_data:/tmp
    command: redis-sentinel /etc/redis/sentinel.conf --port 26379
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  sentinel-2:
    image: redis:7-alpine
    container_name: trustwise-sentinel-2
    ports:
      - "26380:26379"
    volumes:
      - ./config/redis/sentinel-2.conf:/etc/redis/sentinel.conf
      - sentinel2_data:/tmp
    command: redis-sentinel /etc/redis/sentinel.conf --port 26379
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  sentinel-3:
    image: redis:7-alpine
    container_name: trustwise-sentinel-3
    ports:
      - "26381:26379"
    volumes:
      - ./config/redis/sentinel-3.conf:/etc/redis/sentinel.conf
      - sentinel3_data:/tmp
    command: redis-sentinel /etc/redis/sentinel.conf --port 26379
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "sentinel", "masters"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  # Phase 5B: HAProxy Load Balancer for API Gateway
  haproxy:
    image: haproxy:2.8-alpine
    container_name: trustwise-haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./config/ssl/server.pem:/etc/ssl/private/server.pem:ro
    command: haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - fastapi
      - fastapi-2
      - fastapi-3
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8404/stats",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  # FastAPI Application (multiple instances for load balancing)
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustwise-fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
    ports:
      - "8000:8000"
    depends_on:
      - postgres-primary
      - redis-master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  fastapi-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustwise-fastapi-2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
    depends_on:
      - postgres-primary
      - redis-master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  fastapi-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustwise-fastapi-3
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
    depends_on:
      - postgres-primary
      - redis-master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  # Phase 5B: PostgreSQL High Availability
  postgres-primary:
    image: postgres:15-alpine
    container_name: trustwise-postgres-primary
    environment:
      POSTGRES_USER: trustwise
      POSTGRES_PASSWORD: trustwise
      POSTGRES_DB: trustwise_dev
    ports:
      - "5432:5432"
    volumes:
      - ./config/postgresql/postgresql-primary.conf:/etc/postgresql/postgresql.conf
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./config/postgresql/init:/docker-entrypoint-initdb.d
      - postgres_primary_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustwise -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  postgres-standby-1:
    image: postgres:15-alpine
    container_name: trustwise-postgres-standby-1
    environment:
      POSTGRES_USER: trustwise
      POSTGRES_PASSWORD: trustwise
      POSTGRES_DB: trustwise_dev
      PGUSER: trustwise
      PGPASSWORD: replication_password
    ports:
      - "5433:5432"
    volumes:
      - ./config/postgresql/postgresql-standby.conf:/etc/postgresql/postgresql.conf
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - postgres_standby1_data:/var/lib/postgresql/data
    command: |
      sh -c 'pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replication -v -P -R &&
             postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf'
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustwise -h localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  postgres-standby-2:
    image: postgres:15-alpine
    container_name: trustwise-postgres-standby-2
    environment:
      POSTGRES_USER: trustwise
      POSTGRES_PASSWORD: trustwise
      POSTGRES_DB: trustwise_dev
      PGUSER: trustwise
      PGPASSWORD: replication_password
    ports:
      - "5434:5432"
    volumes:
      - ./config/postgresql/postgresql-standby.conf:/etc/postgresql/postgresql.conf
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - postgres_standby2_data:/var/lib/postgresql/data
    command: |
      sh -c 'pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replication -v -P -R &&
             postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf'
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustwise -h localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  # Keep original postgres as reference (Phase 4 for compatibility)
  postgres-legacy:
    image: postgres:15-alpine
    container_name: trustwise-postgres-legacy
    environment:
      POSTGRES_USER: trustwise
      POSTGRES_PASSWORD: trustwise
      POSTGRES_DB: trustwise_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres_legacy_data:/var/lib/postgresql/data
    depends_on:
      - postgres-primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustwise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  celery-worker-web:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: trustwise-celery-web
    command: celery -A app.celery_config worker -l info -Q extraction.web -n web@%h
    environment:
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
      - postgres-primary
    networks:
      - trustwise-network
    restart: unless-stopped

  celery-worker-research:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: trustwise-celery-research
    command: celery -A app.celery_config worker -l info -Q extraction.research -n research@%h
    environment:
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
      - postgres-primary
    networks:
      - trustwise-network
    restart: unless-stopped

  celery-worker-vector:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: trustwise-celery-vector
    command: celery -A app.celery_config worker -l info -Q extraction.vector -n vector@%h
    environment:
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
      - postgres-primary
    networks:
      - trustwise-network
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: trustwise-celery-beat
    command: celery -A app.celery_config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
      - postgres-primary
    networks:
      - trustwise-network
    restart: unless-stopped

  celery-flower:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: trustwise-celery-flower
    command: celery -A app.celery_config flower --port=5555
    environment:
      REDIS_BROKER: sentinel://sentinel-1:26379/0
      REDIS_BACKEND: sentinel://sentinel-1:26379/1
      REDIS_SENTINEL_HOSTS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_SENTINEL_MASTER: mymaster
      DATABASE_URL: postgresql://trustwise:trustwise@postgres-primary:5432/trustwise_dev
    ports:
      - "5555:5555"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
    networks:
      - trustwise-network
    restart: unless-stopped

volumes:
  # Redis HA
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:
  sentinel1_data:
  sentinel2_data:
  sentinel3_data:

  # PostgreSQL HA
  postgres_data:
  postgres_primary_data:
  postgres_standby1_data:
  postgres_standby2_data:
  postgres_legacy_data:
  postgres_wal_archive:

  # Monitoring
  prometheus_data:
  grafana_data:
  alertmanager_data:
