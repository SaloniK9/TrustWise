version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trustwise-postgres
    environment:
      POSTGRES_USER: trustwise
      POSTGRES_PASSWORD: trustwise
      POSTGRES_DB: trustwise_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustwise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustwise-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trustwise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trustwise.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - trustwise-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: trustwise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/monitoring/prometheus_rules.yml:/etc/prometheus/rules/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - trustwise-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: trustwise-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/trustwise.json
    depends_on:
      - prometheus
    networks:
      - trustwise-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: trustwise-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - trustwise-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  trustwise-network:
    driver: bridge
