---
# HPA for Celery Workers - Vector Queue
# CPU-intensive, more aggressive scaling

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-vector-hpa
  namespace: trustwise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-vector
  minReplicas: 1
  maxReplicas: 10  # Lower ceiling due to CPU intensity
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # More aggressive (lower threshold)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Longer wait before scale down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      selectPolicy: Max

---
# VerticalPodAutoscaler (Optional)
# For right-sizing resource requests/limits
# Requires: vertical-pod-autoscaler to be installed

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: trustwise-vpa
  namespace: trustwise
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-app
  updatePolicy:
    updateMode: "Auto"  # Automatically apply VPA recommendations
  resourcePolicy:
    containerPolicies:
    - containerName: fastapi
      minAllowed:
        cpu: 50m
        memory: 128Mi
      maxAllowed:
        cpu: 1000m
        memory: 1Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
