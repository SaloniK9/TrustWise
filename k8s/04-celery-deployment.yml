---
# Celery Worker Deployment - Web Extractor
# Specialized workers for web scraping tasks

apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-web
  namespace: trustwise
  labels:
    app: celery
    component: worker
    queue: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: celery
      component: worker
      queue: web
  template:
    metadata:
      labels:
        app: celery
        component: worker
        queue: web
    spec:
      serviceAccountName: trustwise-sa
      
      containers:
      - name: celery-worker
        image: trustwise:celery-worker
        imagePullPolicy: IfNotPresent
        
        command:
        - celery
        - -A
        - app.celery_config
        - worker
        - -Q
        - extraction.web
        - -l
        - info
        - -n
        - web@%h
        
        env:
        - name: REDIS_BROKER
          value: "redis://redis-sentinel-service:26379/0"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: trustwise-secrets
              key: DATABASE_URL
        - name: PYTHONUNBUFFERED
          value: "1"
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # Health check
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.celery_config
            - inspect
            - active
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: queue
                  operator: In
                  values:
                  - web
              topologyKey: kubernetes.io/hostname

